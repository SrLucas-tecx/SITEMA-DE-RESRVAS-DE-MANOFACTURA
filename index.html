<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservas · Celda de Manufactura</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <header class="top">
    <h1>Reservas · Celda de Manufactura</h1>
    <p id="modo"></p>
  </header>

  <main>
    <div id="aviso"></div>

    <!-- Fecha y botón para apartar -->
    <div class="card nav">
      <button id="prev">◀</button>
      <input type="date" id="fecha">
      <button id="next">▶</button>
      <button id="hoy">Hoy</button>
      <button class="p" id="abrirApartar">+ Apartar</button>
    </div>

    <!-- Leyenda de colores (se llena desde app.js) -->
    <div class="card ley" id="leyenda"></div>

    <!-- Calendario del día -->
    <div class="card w">
      <table id="grid"></table>
      <p class="sub" style="margin:8px 0 0">Toca una celda libre para apartar o una celda de color para cancelar. Gris = no disponible.</p>
    </div>

    <div class="card">
      <b>Reservas del día</b>
      <ul id="lista"></ul>
    </div>
  </main>

  <!-- POPUP: apartar -->
  <dialog id="modalApartar">
    <div id="formApartar">
      <h2>Apartar</h2>
      <p class="sub" id="resumen"></p>
      <div class="g">
        <label>Nombre completo <input id="nombre" autocomplete="name"></label>
        <label>Matrícula <input id="matricula"></label>
        <label>Hora de inicio <select id="inicio"></select></label>
        <label>Duración <select id="dur"></select></label>
      </div>
      <div class="eq" id="eq"></div>
      <div id="out"></div>
      <div class="acciones">
        <button id="cerrarApartar">Cerrar</button>
        <button class="p" id="apartar">Apartar</button>
      </div>
    </div>

    <!-- Se muestra al terminar la reserva -->
    <div id="exito" hidden>
      <h2>¡Reserva lista!</h2>
      <p>Tu código de cancelación es:</p>
      <div class="codigo" id="codigo"></div>
      <p class="sub">Guárdalo: lo necesitas junto con tu matrícula para cancelar.</p>
      <div class="acciones"><button class="p" id="cerrarExito">Entendido</button></div>
    </div>
  </dialog>

  <!-- POPUP: cancelar -->
  <dialog id="modalCancelar">
    <h2>Cancelar reserva</h2>
    <p id="cinfo" class="sub"></p>
    <div class="g">
      <label>Matrícula <input id="cmat"></label>
      <label>Código de cancelación <input id="ccod"></label>
    </div>
    <div id="cout"></div>
    <div class="acciones">
      <button id="cerrar">Cerrar</button>
      <button class="p" id="cancelar">Cancelar reserva</button>
    </div>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
