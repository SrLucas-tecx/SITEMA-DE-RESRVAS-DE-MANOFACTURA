<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservas · Celda de Manufactura</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <main>
    <h1>Reservas · Celda de Manufactura</h1>
    <p class="sub" id="modo"></p>

    <!-- Selector de fecha -->
    <div class="card nav">
      <button id="prev">◀</button>
      <input type="date" id="fecha">
      <button id="next">▶</button>
      <button id="hoy">Hoy</button>
      <span class="sub" style="margin:0">Rojo = ocupado · Gris = no disponible · Toca una celda libre para apartar</span>
    </div>

    <!-- Calendario del día (se dibuja desde app.js) -->
    <div class="card w">
      <table id="grid"></table>
    </div>

    <!-- Formulario para apartar -->
    <div class="card">
      <b>Apartar</b>
      <div class="g" style="margin-top:8px">
        <label>Nombre completo <input id="nombre" autocomplete="name"></label>
        <label>Matrícula <input id="matricula"></label>
        <label>Hora de inicio <select id="inicio"></select></label>
        <label>Duración <select id="dur"></select></label>
      </div>
      <div class="eq" id="eq"></div>
      <button class="p" id="apartar">Apartar</button>
      <div id="out"></div>
    </div>

    <!-- Cancelar (aparece al tocar una celda roja) -->
    <div class="card" id="cancelCard" hidden>
      <b>Cancelar reserva</b>
      <p id="cinfo" class="sub"></p>
      <div class="g">
        <label>Matrícula <input id="cmat"></label>
        <label>Código de cancelación <input id="ccod"></label>
      </div>
      <p style="margin:10px 0 0">
        <button id="cancelar">Cancelar reserva</button>
        <button id="cerrar">Cerrar</button>
      </p>
      <div id="cout"></div>
    </div>

    <!-- Lista del día -->
    <div class="card">
      <b>Reservas del día</b>
      <ul id="lista"></ul>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
